<text x="56" y="81" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="start">Upstream</text>
<rect x="22" y="104" width="184" height="34" rx="10" fill="#f5f5f7" stroke="none" stroke-width="1.5"/>
<text x="36" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">Repos</text>
<text x="36" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Changes</text>
<text x="192" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a35500" text-anchor="end">1</text>
<text x="36" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Runs</text>
<text x="36" y="638" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">Connect AI</text>
<circle cx="40" cy="664" r="5" fill="#248a3d"/><text x="52" y="669" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Private to this Mac</text>
<line x1="219" y1="45" x2="219" y2="691" stroke="#f5f5f7" stroke-width="2"/>
<text x="260" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#1d1d1f" text-anchor="start">Send to GitHub</text>
<text x="260" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">my-app · branch main</text>
<rect x="260" y="156" width="280" height="40" rx="20" fill="#f5f5f7" stroke="none" stroke-width="1.5"/><rect x="264" y="160" width="136" height="32" rx="16" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="332" y="181" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1d1d1f" text-anchor="middle">Private</text><text x="470" y="181" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="middle">Show the world</text>
<text x="260" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">GitHub repo to send to (owner/name, already created on GitHub)</text>
<rect x="260" y="244" width="520" height="38" rx="8" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="276" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start">you/my-app</text>
<text x="260" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">GitHub access token, used for this send only and never stored</text>
<rect x="260" y="326" width="520" height="38" rx="8" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="276" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">••••••••••••••••••••</text>
<rect x="260" y="384" width="520" height="64" rx="10" fill="#fff8e6" stroke="none" stroke-width="1.5"/><text x="276" y="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="start">Turning workflows back on there would cost about $38 a month</text><text x="276" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">at GitHub’s rates, after free minutes.</text>
<path d="M262 482 l8 -14 l8 14 z" fill="none" stroke="#d70015" stroke-width="1.6"/><text x="286" y="481" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#d70015" text-anchor="start">Copilot may be training on your code. Turn it off before you send.</text>
<rect x="260" y="510" width="140" height="36" rx="18" fill="#ffad00" stroke="#ffad00" stroke-width="1.5"/><text x="330.0" y="533" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">Send branch</text><text x="420" y="533" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">Never forced. Nothing else leaves this Mac.</text>
<rect x="800" y="150" width="270" height="94" rx="10" fill="#fff8e6" stroke="#ffad00" stroke-width="1.2"/><text x="814" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#1d1d1f" text-anchor="start">“Show the world” refuses to publish</text><text x="814" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">while the safety check finds secrets</text><text x="814" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">in the history, or commits carry</text><text x="814" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">personal email addresses.</text>
<rect x="1050" y="14" width="134" height="26" rx="13" fill="#fff" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4 3"/><text x="1117" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6e6e73" text-anchor="middle">WIREFRAME</text>
</svg>