<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Upstream wireframe: Move in">
<rect width="1200" height="800" fill="#ffffff"/>
<text x="40" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="start">Move in from GitHub</text>
<text x="40" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">Three screens, one after the other</text>
<g transform="translate(-260,12) scale(1.2)"><rect x="250" y="70" width="290" height="560" rx="12" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="270" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">1 · Paste a token</text><rect x="270" y="130" width="250" height="30" rx="8" fill="#f5f5f7" stroke="none" stroke-width="1.5"/><text x="284" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="start">GitHub</text><text x="380" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">GitLab · soon</text><text x="270" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">GitHub access token, used for</text><text x="270" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">this move only and never stored</text><rect x="270" y="226" width="250" height="38" rx="8" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="284" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">••••••••••••••••••••</text><text x="270" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Read access to repos and Actions.</text><text x="270" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Billing read shows what Actions</text><text x="270" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">already cost you.</text><rect x="400" y="520" width="110" height="36" rx="18" fill="#ffad00" stroke="#ffad00" stroke-width="1.5"/><text x="455.0" y="543" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">Continue</text><rect x="560" y="70" width="290" height="560" rx="12" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="580" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">2 · Pick repos</text><rect x="580" y="146" width="18" height="18" rx="4" fill="#ffad00" stroke="#ffad00" stroke-width="1.5"/><path d="M584 155 l4 4 l7 -8" fill="none" stroke="#1d1d1f" stroke-width="2"/><text x="608" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">my-app</text><rect x="580" y="194" width="18" height="18" rx="4" fill="#ffad00" stroke="#ffad00" stroke-width="1.5"/><path d="M584 203 l4 4 l7 -8" fill="none" stroke="#1d1d1f" stroke-width="2"/><text x="608" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">payments-api</text><rect x="580" y="242" width="18" height="18" rx="4" fill="#ffad00" stroke="#ffad00" stroke-width="1.5"/><path d="M584 251 l4 4 l7 -8" fill="none" stroke="#1d1d1f" stroke-width="2"/><text x="608" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">ios-client</text><rect x="580" y="290" width="18" height="18" rx="4" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="608" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">website</text><text x="608" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73" text-anchor="start">Public: CI is free on GitHub</text><rect x="580" y="338" width="18" height="18" rx="4" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="608" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">dotfiles</text><text x="608" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6e6e73" text-anchor="start">Public: CI is free on GitHub</text><text x="580" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1d1d1f" text-anchor="start">Private repos are ticked.</text><text x="580" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Everything comes along except</text><text x="580" y="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">secrets. Open pull requests</text><text x="580" y="462" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">become changes. Nothing is</text><text x="580" y="480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">deleted on GitHub.</text><rect x="720" y="520" width="110" height="36" rx="18" fill="#ffad00" stroke="#ffad00" stroke-width="1.5"/><text x="775.0" y="543" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="middle">Move in</text><rect x="870" y="70" width="290" height="560" rx="12" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/><text x="890" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">3 · Moving in</text><circle cx="896" cy="156" r="5" fill="#248a3d"/><text x="912" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">my-app</text><text x="1140" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="end">Done</text><circle cx="896" cy="204" r="5" fill="#ffad00"/><text x="912" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">payments-api</text><text x="1140" y="209" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="end">Converting workflows</text><circle cx="896" cy="252" r="5" fill="#d2d2d7"/><text x="912" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start">ios-client</text><text x="1140" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="end">Waiting</text><rect x="890" y="290" width="250" height="98" rx="10" fill="#fff2f2" stroke="#f3c4c8" stroke-width="1.5"/><text x="906" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#d70015" text-anchor="start">You lost $212.40 to GitHub</text><text x="906" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#d70015" text-anchor="start">Actions on these repos.</text><text x="906" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1d1d1f" text-anchor="start">That stops today.</text><text x="890" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1d1d1f" text-anchor="start">1 workflow step needs you:</text><text x="890" y="440" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">add it to .upstream/run.yml</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs><path d="M540 350 H556" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><path d="M850 350 H866" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#a)"/><text x="60" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="1" font-weight="400" fill="#1d1d1f" text-anchor="start"></text></g>
<rect x="1050" y="14" width="134" height="26" rx="13" fill="#fff" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4 3"/><text x="1117" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6e6e73" text-anchor="middle">WIREFRAME</text>
</svg>