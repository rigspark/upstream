<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Upstream wireframe: how code moves through Upstream">
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="start">How code moves through Upstream</text>
<text x="40" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start">Everything in the dashed box stays on your Mac. Only the last step talks to GitHub, and only when you say so.</text>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1d1f"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
<rect x="196" y="108" width="800" height="300" rx="18" fill="none" stroke="#248a3d" stroke-width="1.6" stroke-dasharray="7 5"/><text x="212" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#248a3d" text-anchor="start">Your Mac · 127.0.0.1:7900</text>
<rect x="24" y="170" width="132" height="84" rx="12" fill="#f5f5f7" stroke="none" stroke-width="1.5"/><text x="90.0" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">GitHub</text><text x="90.0" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">your repos today</text>
<rect x="226" y="170" width="140" height="84" rx="12" fill="#f5f5f7" stroke="none" stroke-width="1.5"/><text x="296.0" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Repos</text><text x="296.0" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">git clone / push</text><text x="296.0" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">over http</text>
<rect x="420" y="170" width="150" height="84" rx="12" fill="#f5f5f7" stroke="none" stroke-width="1.5"/><text x="495.0" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Runs</text><text x="495.0" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">.upstream/run.yml</text><text x="495.0" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">on every push</text>
<rect x="624" y="170" width="150" height="84" rx="12" fill="#f5f5f7" stroke="none" stroke-width="1.5"/><text x="699.0" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Changes</text><text x="699.0" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">diff + checks +</text><text x="699.0" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">secret scan</text>
<rect x="828" y="170" width="140" height="84" rx="12" fill="#fff8e6" stroke="#ffad00" stroke-width="1.5"/><text x="898.0" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Merge</text><text x="898.0" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">you only,</text><text x="898.0" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">squash merge</text>
<rect x="1040" y="170" width="136" height="84" rx="12" fill="#f5f5f7" stroke="none" stroke-width="1.5"/><text x="1108.0" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">GitHub</text><text x="1108.0" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">a branch, when</text><text x="1108.0" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">you’re ready</text>
<path d="M156 212 H224" stroke="#1d1d1f" stroke-width="1.6" marker-end="url(#f)"/>
<text x="191.0" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a35500" text-anchor="middle">Move in</text>
<path d="M366 212 H418" stroke="#1d1d1f" stroke-width="1.6" marker-end="url(#f)"/>
<text x="393.0" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a35500" text-anchor="middle">push</text>
<path d="M570 212 H622" stroke="#1d1d1f" stroke-width="1.6" marker-end="url(#f)"/>
<text x="597.0" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a35500" text-anchor="middle">green</text>
<path d="M774 212 H826" stroke="#1d1d1f" stroke-width="1.6" marker-end="url(#f)"/>
<path d="M968 212 H1038" stroke="#1d1d1f" stroke-width="1.6" marker-end="url(#f)"/>
<text x="1004.0" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a35500" text-anchor="middle">Send</text>
<rect x="420" y="300" width="354" height="84" rx="12" fill="#f5f5f7" stroke="none" stroke-width="1.5"/><text x="597.0" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">Claude · Codex · apps on this Mac</text><text x="597.0" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle">over MCP, one key each: read code, open changes, read runs</text>
<path d="M495 300 V256" stroke="#6e6e73" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/><path d="M699 300 V256" stroke="#6e6e73" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
<path d="M774 342 H898 V256" fill="none" stroke="#d70015" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M890 270 l16 16 M906 270 l-16 16" stroke="#d70015" stroke-width="2"/>
<text x="786" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#d70015" text-anchor="start">merge, send and approve</text><text x="786" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#d70015" text-anchor="start">are not tools at all for them</text>
<text x="40" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">GitHub tokens are pasted for one move or one send, kept in memory and never written to disk.</text>
<text x="40" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start">A failed run opens on its likely cause. Steps marked approve: true wait for you.</text>
<rect x="1050" y="14" width="134" height="26" rx="13" fill="#fff" stroke="#6e6e73" stroke-width="1" stroke-dasharray="4 3"/><text x="1117" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6e6e73" text-anchor="middle">WIREFRAME</text>
</svg>